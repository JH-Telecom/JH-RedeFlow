services:
  - type: web
    name: jh-redeflow-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace backend
    startCommand: node backend/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDEFLOW_RUNTIME
        value: supabase
      - key: REDEFLOW_DEMO_DATA
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: WUZAPI_WEBHOOK_TOKEN
        sync: false
      - key: WUZAPI_ACTIVATION_GROUP_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WUZAPI_DEBUG
        value: "false"
      - key: GOOGLE_DRIVE_SYNC_ENABLED
        value: "true"
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: "1m9m2atkUrxwb2v9xzTLgqebOQ4GQJue-"
      - key: GOOGLE_DRIVE_SYNC_HOUR
        value: "9"
      - key: GOOGLE_DRIVE_TIMEZONE
        value: America/Sao_Paulo
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
